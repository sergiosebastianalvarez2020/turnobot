[tool.pytest.ini_options]
testpaths = ["tests", "."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra -q --cov=. --cov-report=term-missing"

[tool.coverage.run]
source = ["."]
omit = [
    "*/__pycache__/*",
    "*/venv/*",
    "*/venv312/*",
    "*/site-packages/*",
    "*/tests/*",
    "test_*.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
