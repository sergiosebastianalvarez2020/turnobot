<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Iniciar Sesión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #F8FAFC;
            color: #0F172A;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }

        .login-card {
            background: #FFFFFF;
            border: 1px solid #E2E8F0;
            border-radius: 16px;
            padding: 48px 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,.08);
        }

        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 32px;
        }

        .brand-mark {
            width: 44px;
            height: 44px;
            background: #2563EB;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 15px;
            color: #FFFFFF;
            box-shadow: 0 4px 14px rgba(37,99,235,.15);
        }

        .brand-name {
            font-size: 20px;
            font-weight: 700;
            color: #0F172A;
        }

        h1 {
            font-size: 17px;
            font-weight: 600;
            color: #64748B;
            text-align: center;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #64748B;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            background: #F8FAFC;
            border: 1px solid #E2E8F0;
            border-radius: 10px;
            color: #0F172A;
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="password"]:focus {
            border-color: #2563EB;
            box-shadow: 0 0 0 3px rgba(37,99,235,.1);
        }

        .error-msg {
            background: #FEF2F2;
            border: 1px solid #FECACA;
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #DC2626;
            text-align: center;
            font-weight: 500;
        }

        .btn-login {
            width: 100%;
            padding: 13px;
            background: #2563EB;
            border: none;
            border-radius: 10px;
            color: #FFFFFF;
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, box-shadow 0.2s;
        }

        .btn-login:hover {
            background: #1D4ED8;
            box-shadow: 0 4px 14px rgba(37,99,235,.2);
        }

        .btn-login:active {
            background: #1E40AF;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #94A3B8;
            text-decoration: none;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: #2563EB;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="brand">
            <div class="brand-mark">EC</div>
            <span class="brand-name">El Corte</span>
        </div>

        <h1>Panel de administración</h1>

        {% if error %}
        <div class="error-msg">{{ error_message or "Contraseña incorrecta. Intentá nuevamente." }}</div>
        {% endif %}

        <form method="POST" action="/login">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Ingresá la contraseña"
                    autofocus
                    required
                >
            </div>

            <button type="submit" class="btn-login">Ingresar</button>
        </form>

        <a href="/" class="back-link">Volver al chat</a>
    </div>
</body>
</html>
