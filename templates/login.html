<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Iniciar Sesión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: #090909;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: #111111;
            border: 1px solid #1e1e1e;
            border-radius: 16px;
            padding: 48px 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 32px;
        }

        .brand-mark {
            width: 44px;
            height: 44px;
            background: #f4d35e;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
            color: #090909;
        }

        .brand-name {
            font-size: 20px;
            font-weight: 600;
            color: #ffffff;
        }

        h1 {
            font-size: 18px;
            font-weight: 600;
            color: #ffffff;
            text-align: center;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #888888;
            margin-bottom: 8px;
        }

        input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 10px;
            color: #ffffff;
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="password"]:focus {
            border-color: #f4d35e;
        }

        .error-msg {
            background: #2a1515;
            border: 1px solid #4a2020;
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #ff6b6b;
            text-align: center;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: #f4d35e;
            border: none;
            border-radius: 10px;
            color: #090909;
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-login:hover {
            background: #e6c74e;
        }

        .btn-login:active {
            background: #d4b83e;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #666666;
            text-decoration: none;
        }

        .back-link:hover {
            color: #f4d35e;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="brand">
            <div class="brand-mark">EC</div>
            <span class="brand-name">El Corte</span>
        </div>

        <h1>Panel de administración</h1>

        {% if error %}
        <div class="error-msg">Contraseña incorrecta. Intentá nuevamente.</div>
        {% endif %}

        <form method="POST" action="/login">
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Ingresá la contraseña"
                    autofocus
                    required
                >
            </div>

            <button type="submit" class="btn-login">Ingresar</button>
        </form>

        <a href="/" class="back-link">Volver al chat</a>
    </div>
</body>
</html>
