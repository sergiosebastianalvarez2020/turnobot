<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error {{ code }}</title>
    <style>
        body { font-family: 'DM Sans', sans-serif; background: #EAF4FF; color: #102A56; margin: 0; padding: 40px; }
        .container { max-width: 560px; margin: 60px auto; background: #fff; border-radius: 16px; padding: 40px; text-align: center; }
        h1 { font-size: 48px; margin: 0 0 16px 0; }
        p { font-size: 16px; line-height: 1.6; color: #555; }
        a { color: #1463FF; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="container">
        <h1>{{ code }}</h1>
        <p>{{ message }}</p>
        <p><a href="/">Volver al inicio</a></p>
        {% if request_id and request_id != '-' %}
        <p style="font-size: 13px; color: #888; margin-top: 24px;">ID de solicitud: <code>{{ request_id }}</code></p>
        {% endif %}
    </div>
</body>
</html>
