<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contrase&ntilde;a - {{ business_name or "Mi negocio" }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #EAF4FF;
            color: #102A56;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
            position: relative;
            overflow: hidden;
        }
        body::before {
            content: "";
            position: fixed;
            top: -120px;
            right: -100px;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(20,99,255,.06) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }
        body::after {
            content: "";
            position: fixed;
            bottom: -150px;
            left: -80px;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(20,99,255,.04) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }
        .card {
            background: rgba(255,255,255,.88);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid #C9DDF8;
            border-radius: 20px;
            padding: 48px 40px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 12px 40px rgba(11,27,58,.10);
            position: relative;
            z-index: 1;
        }
        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 28px;
        }
        .brand-mark {
            width: 46px;
            height: 46px;
            background: #1463FF;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 15px;
            color: #FFFFFF;
            box-shadow: 0 4px 16px rgba(20,99,255,.15);
        }
        .brand-name {
            font-size: 21px;
            font-weight: 700;
            color: #0B1B3A;
        }
        h1 {
            font-size: 15px;
            font-weight: 600;
            color: #4A6590;
            text-align: center;
            margin-bottom: 28px;
        }
        .form-group { margin-bottom: 20px; }
        label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: #4A6590;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            background: #EEF6FF;
            border: 1px solid #C9DDF8;
            border-radius: 12px;
            color: #102A56;
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input:focus {
            border-color: #1463FF;
            box-shadow: 0 0 0 3px rgba(20,99,255,.1);
            background: #FFFFFF;
        }
        .notice {
            background: rgba(20,99,255,.06);
            border: 1px solid #C9DDF8;
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 24px;
            font-size: 13px;
            color: #102A56;
            text-align: center;
        }
        .btn {
            width: 100%;
            padding: 13px;
            background: #1463FF;
            border: none;
            border-radius: 12px;
            color: #FFFFFF;
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, box-shadow 0.2s;
        }
        .btn:hover { background: #0757E8; box-shadow: 0 4px 16px rgba(20,99,255,.2); }
        .btn:active { background: #0B1B3A; }
        .btn:focus-visible { outline: 3px solid #1463FF; outline-offset: 2px; }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #5B6B84;
            text-decoration: none;
        }
        .back-link:hover { color: #1463FF; }
    </style>
</head>
<body>
    <div class="card">
        <div class="brand">
            <div class="brand-mark">{{ business_name[:3] | upper if business_name else "TB" }}</div>
            <span class="brand-name">{{ business_name }}</span>
        </div>

        <h1>Recuperar contrase&ntilde;a</h1>

        {% if sent %}
        <div class="notice">
            Si el email ingresado corresponde a una cuenta activa,
            recibir&aacute;s un enlace para restablecer tu contrase&ntilde;a.
        </div>
        {% else %}
        <form method="POST" action="/forgot">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required placeholder="te@servicio.com" autocomplete="email">
            </div>
            <button type="submit" class="btn">Enviar enlace de recuperaci&oacute;n</button>
        </form>
        {% endif %}

        <a href="{{ admin_prefix or '' }}/login" class="back-link">Volver al inicio de sesi&oacute;n</a>
    </div>
</body>
</html>
