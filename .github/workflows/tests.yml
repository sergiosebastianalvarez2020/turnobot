name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  POSTGRES_PASSWORD: 4h_ephemeral_pg_password

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          PGPASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "psql -U postgres -d postgres -c 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Lint (ruff check)
        run: python -m ruff check .
      - name: Format check (ruff format)
        run: python -m ruff format --check .
      - name: Type check (mypy, incremental)
        run: python -m mypy
      - name: Run tests with coverage
        env:
          TURNOBOT_PG_URL: postgresql://postgres:${{ env.POSTGRES_PASSWORD }}@localhost:5432/postgres
        run: python -m pytest
      - name: Diagnose PostgreSQL connectivity
        env:
          TURNOBOT_PG_URL: postgresql://postgres:${{ env.POSTGRES_PASSWORD }}@localhost:5432/postgres
        run: |
          echo "TURNOBOT_PG_URL present: ${TURNOBOT_PG_URL:+YES}"
          python3 -c "import os; from urllib.parse import urlsplit; u=os.getenv('TURNOBOT_PG_URL'); p=__import__('urllib.parse').urlsplit(u) if u else None; print('host=' + (p.hostname or 'NONE')) if p else print('TURNOBOT_PG_URL is NOT set'); print('port=' + str(p.port)) if p and p.port else None; print('path=' + p.path) if p else None"
      - name: Test Python PostgreSQL connection
        env:
          TURNOBOT_PG_URL: postgresql://postgres:${{ env.POSTGRES_PASSWORD }}@localhost:5432/postgres
        run: |
          python3 -c "import os, psycopg; u=os.environ['TURNOBOT_PG_URL']; conn=psycopg.connect(u, connect_timeout=5); conn.close(); print('PYTHON_PG_CONNECT=OK')"
      - name: Guard - tests_pg no pueden quedar skipped/deselected en CI
        env:
          TURNOBOT_PG_URL: postgresql://postgres:${{ env.POSTGRES_PASSWORD }}@localhost:5432/postgres
        run: |
          set -euo pipefail
          output="$(python -m pytest tests_pg -q -p no:cacheprovider --no-cov --tb=short 2>&1 || true)"
          printf '%s\n' "$output"
          if grep -q "skipped" <<< "$output"; then
            echo "FALLO: tests_pg quedaron con SKIP en CI"
            exit 1
          fi
          if grep -q "deselected" <<< "$output"; then
            echo "FALLO: tests_pg quedaron con DESELECTED en CI"
            exit 1
          fi
          if ! grep -qE "[0-9]+ passed" <<< "$output"; then
            echo "FALLO: tests_pg no registró tests passed"
            exit 1
          fi
