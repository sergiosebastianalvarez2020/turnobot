name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  POSTGRES_PASSWORD: 4h_ephemeral_pg_password

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          PGPASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "psql -U postgres -d postgres -c 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Lint (ruff check)
        run: python -m ruff check .
      - name: Format check (ruff format)
        run: python -m ruff format --check .
      - name: Type check (mypy, incremental)
        run: python -m mypy
      - name: PostgreSQL connectivity diagnostic
        env:
          TURNOBOT_PG_URL: postgresql://postgres:${{ env.POSTGRES_PASSWORD }}@localhost:5432/postgres
        run: |
          cat > /tmp/check_postgres.py <<'PY'
          import os
          import sys

          import psycopg
          from urllib.parse import urlsplit

          url = os.getenv("TURNOBOT_PG_URL")
          if not url:
              print("FAIL: TURNOBOT_PG_URL is not set", file=sys.stderr)
              sys.exit(1)

          parsed = urlsplit(url)
          print(f"Host: {parsed.hostname}")
          print(f"Port: {parsed.port}")
          print(f"Database: {parsed.path or 'NONE'}")

          try:
              with psycopg.connect(url, connect_timeout=10) as conn:
                  print("PostgreSQL connection: OK")
                  with conn.cursor() as cur:
                      cur.execute("SELECT version()")
                      version = cur.fetchone()[0]
                      cur.execute("SELECT current_database()")
                      database = cur.fetchone()[0]
                      cur.execute("SELECT current_user")
                      user = cur.fetchone()[0]
                      cur.execute("SELECT 1")
                      ok = cur.fetchone()[0]
                  print(f"Database: {database}")
                  print(f"User: {user}")
                  print(f"Server version: {version}")
                  print(f"SELECT 1: {ok}")
          except Exception as e:
              print(f"FAIL: PostgreSQL connection failed: {e}", file=sys.stderr)
              sys.exit(1)
          PY

          python /tmp/check_postgres.py
      - name: Run PostgreSQL integration tests (tests_pg)
        id: tests_pg
        env:
          TURNOBOT_PG_URL: postgresql://postgres:${{ env.POSTGRES_PASSWORD }}@localhost:5432/postgres
        run: python -m pytest tests_pg -v --tb=short -p no:cacheprovider --no-cov 2>&1 | tee /tmp/tests_pg_output.txt
      - name: Guard - tests_pg must not be skipped/deselected
        if: steps.tests_pg.outcome == 'success'
        run: |
          output_file="/tmp/tests_pg_output.txt"
          if grep -qE "no tests ran|0 tests" "$output_file"; then
            echo "FALLO: tests_pg no registró tests ejecutados"
            exit 1
          fi
          if grep -q "skipped" "$output_file"; then
            echo "FALLO: tests_pg quedaron con SKIP en CI"
            exit 1
          fi
          if grep -q "deselected" "$output_file"; then
            echo "FALLO: tests_pg quedaron con DESELECTED en CI"
            exit 1
          fi
      - name: Run general tests
        run: python -m pytest tests -p no:cacheprovider
