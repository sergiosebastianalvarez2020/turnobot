name: Tests

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      parallel:
        description: 'Ejecutar tests en paralelo'
        type: choice
        options:
          - "false"
          - "4"
          - "8"
        default: "false"

env:
  POSTGRES_PASSWORD: 4h_ephemeral_pg_password

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          PGPASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "psql -U postgres -d postgres -c 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Lint (ruff check)
        run: python -m ruff check .
      - name: Format check (ruff format)
        run: python -m ruff format --check .
      - name: Type check (mypy, incremental)
        run: python -m mypy
      - name: PostgreSQL connectivity diagnostic
        env:
          TURNOBOT_PG_URL: postgresql://postgres:${{ env.POSTGRES_PASSWORD }}@localhost:5432/postgres
        run: |
          cat > /tmp/check_postgres.py <<'PY'
          import os
          import sys

          import psycopg
          from urllib.parse import urlsplit

          url = os.getenv("TURNOBOT_PG_URL")
          if not url:
              print("FAIL: TURNOBOT_PG_URL is not set", file=sys.stderr)
              sys.exit(1)

          parsed = urlsplit(url)
          print(f"Host: {parsed.hostname}")
          print(f"Port: {parsed.port}")
          print(f"Database: {parsed.path or 'NONE'}")

          try:
              with psycopg.connect(url, connect_timeout=10) as conn:
                  print("PostgreSQL connection: OK")
                  with conn.cursor() as cur:
                      cur.execute("SELECT version()")
                      version = cur.fetchone()[0]
                      cur.execute("SELECT current_database()")
                      database = cur.fetchone()[0]
                      cur.execute("SELECT current_user")
                      user = cur.fetchone()[0]
                      cur.execute("SELECT 1")
                      ok = cur.fetchone()[0]
                  print(f"Database: {database}")
                  print(f"User: {user}")
                  print(f"Server version: {version}")
                  print(f"SELECT 1: {ok}")
          except Exception as e:
              print(f"FAIL: PostgreSQL connection failed: {e}", file=sys.stderr)
              sys.exit(1)
          PY

          python /tmp/check_postgres.py
      - name: Run PostgreSQL integration tests (tests_pg)
        id: tests_pg
        env:
          TURNOBOT_PG_URL: postgresql://postgres:${{ env.POSTGRES_PASSWORD }}@localhost:5432/postgres
        run: |
          set -o pipefail
          python -m pytest tests_pg -v --tb=short -p no:cacheprovider --no-cov 2>&1 | tee /tmp/tests_pg_output.txt
      - name: Guard - tests_pg must not be skipped/deselected
        if: steps.tests_pg.outcome == 'success'
        run: |
          output_file="/tmp/tests_pg_output.txt"
          if grep -qE "no tests ran|0 tests" "$output_file"; then
            echo "FALLO: tests_pg no registrÃ³ tests ejecutados"
            exit 1
          fi
          if grep -q "skipped" "$output_file"; then
            echo "FALLO: tests_pg quedaron con SKIP en CI"
            exit 1
          fi
          if grep -q "deselected" "$output_file"; then
            echo "FALLO: tests_pg quedaron con DESELECTED en CI"
            exit 1
          fi
      - name: Run general tests (secuencial)
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.parallel == '' || inputs.parallel == 'false') || github.event_name == 'pull_request' }}
        id: tests
        env:
          TURNOBOT_PG_URL: postgresql://postgres:${{ env.POSTGRES_PASSWORD }}@localhost:5432/postgres
        run: |
          set -o pipefail
          python -m pytest tests --cov=. --cov-report=term-missing -p no:cacheprovider --junitxml=/tmp/tests_junit.xml 2>&1 | tee /tmp/tests_output.txt
      - name: Run general tests (paralelo)
        if: ${{ github.event_name == 'push' || inputs.parallel == '4' || inputs.parallel == '8' }}
        id: tests_parallel
        env:
          TURNOBOT_PG_URL: postgresql://postgres:${{ env.POSTGRES_PASSWORD }}@localhost:5432/postgres
        run: |
          set -o pipefail
          python -m pytest tests -n ${{ inputs.parallel }} --cov=. --cov-append --cov-report=term-missing --cov-report=xml:coverage.xml -p no:cacheprovider --junitxml=/tmp/tests_junit.xml 2>&1 | tee /tmp/tests_output.txt
      - name: Upload coverage artifact (paralelo)
        if: ${{ github.event_name == 'push' || inputs.parallel == '4' || inputs.parallel == '8' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7
      - name: Guard - tests must not be skipped/deselected
        if: steps.tests.outcome == 'success' || steps.tests_parallel.outcome == 'success'
        run: |
          output_file="/tmp/tests_output.txt"
          junit_file="/tmp/tests_junit.xml"
          if grep -qE "no tests ran|0 tests" "$output_file"; then
            echo "FALLO: tests no registrÃ³ tests ejecutados"
            exit 1
          fi
          if grep -q "deselected" "$output_file"; then
            echo "FALLO: tests quedaron con DESELECTED en CI"
            exit 1
          fi
          # Usar JUnit XML para detectar skips de forma fiable por nodeid
          # Solo permitir el skip arquitectural conocido:
          # tests.test_secure_turnos_contract::test_crear_consultar_cancelar_reprogramar_con_token_propio
          if [ ! -f "$junit_file" ]; then
            echo "FALLO: no se encontrÃ³ $junit_file, no se pudo validar skips"
            exit 1
          fi
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          import sys

          allowed_skip = "tests.test_secure_turnos_contract::test_crear_consultar_cancelar_reprogramar_con_token_propio"
          junit_file = "/tmp/tests_junit.xml"

          try:
              tree = ET.parse(junit_file)
          except ET.ParseError as e:
              print(f"FALLO: XML invÃ¡lido en $junit_file: {e}")
              sys.exit(1)
          except Exception as e:
              print(f"FALLO: error leyendo $junit_file: {e}")
              sys.exit(1)

          root = tree.getroot()

          unexpected_skips = []
          for testcase in root.iter("testcase"):
              skipped = testcase.find("skipped")
              if skipped is not None:
                  classname = testcase.get("classname", "")
                  name = testcase.get("name", "")
                  full_id = f"{classname}::{name}" if classname else name
                  # Normalizar para comparar (pytest usa :: como separador)
                  if full_id != allowed_skip:
                      unexpected_skips.append(full_id)

          if unexpected_skips:
              print("FALLO: tests quedaron con SKIP inesperados en CI")
              for sid in unexpected_skips:
                  print(f"  SKIP inesperado: {sid}")
              sys.exit(1)
          PY
      - name: Run TestSesion isolation tests T4-T6 (verbose)
        # Evidencia individual de los 3 tests de aislamiento entre negocios.
        # Usa el mismo PostgreSQL 16 y entorno que la suite general.
        # `if: always()` para que la evidencia quede registrada aun si la
        # suite general falla; no modifica cÃ³digo bajo prueba.
        if: always()
        env:
          TURNOBOT_PG_URL: postgresql://postgres:${{ env.POSTGRES_PASSWORD }}@localhost:5432/postgres
        run: |
          python -m pytest \
            "tests/test_multi_tenant_admin.py::TestSesion::test_sesion_negocio_b_no_accede_admin_negocio_1" \
            "tests/test_multi_tenant_admin.py::TestSesion::test_usuario_miembro_ambos_negocios_accede_a_ambos_admin" \
            "tests/test_multi_tenant_admin.py::TestSesion::test_post_admin_otro_negocio_rechazado_sin_efecto" \
            -v --tb=short -p no:cacheprovider --no-cov
