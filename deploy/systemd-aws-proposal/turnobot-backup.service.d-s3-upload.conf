[Service]
# Dispara la subida S3 solo si ExecStart (pg_dump) termino bien.
# "+" eleva a root para systemctl (User=ubuntu no puede arrancar units de sistema).
# --no-block: no espera la subida; "|| true": un fallo o job S3 ya en curso
# NO convierte el backup local exitoso en unit fallida ni dispara OnFailure.
ExecStartPost=+/bin/bash -c '/bin/systemctl start --no-block turnobot-backup-s3.service || true'
