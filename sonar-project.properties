# SonarCloud configuration for TurnoBot
# This file configures the SonarCloud analysis for the Python project

# === Project Identification ===
# Organización y clave del proyecto en SonarCloud.
# Estos valores deben coincidir con los del dashboard:
#   https://sonarcloud.io/dashboard?id=sergiosebastianalvarez2020_turnobot
sonar.organization=sergiosebastianalvarez2020
sonar.projectKey=sergiosebastianalvarez2020_turnobot

# === Python Version ===
# Project targets Python 3.12 (confirmed by pyproject.toml ruff/mypy config and CI matrix)
sonar.python.version=3.12

# === Source Code ===
# Directories containing the Python source code to be analyzed
sonar.sources=application,routes,services,database,app.py

# === Tests ===
# Directories containing Python tests to be analyzed
# - tests/: general unit/integration tests (pytest)
# - tests_pg/: PostgreSQL integration tests (conditionally executed)
# Tests directories are analyzed recursively by SonarQube.
# tests/visual/ contains UI/accessibility tests (Playwright/axe) - their classification
# depends on the sonar.tests configuration. They are not excluded automatically.
sonar.tests=tests,tests_pg

# === Coverage ===
# Paths to coverage reports generated by CI (coverage.xml is produced by pytest --cov=)
sonar.python.coverage.reportPaths=coverage.xml

# === Exclusions ===
# Files and directories to exclude from analysis (generated, cached, virtual environment)
sonar.exclusions=**/__pycache__/**,**.venv/**,**/.venv312/**,**/venv312/**,**/htmlcov/**,**/.coverage**,**/*.egg-info/**,**/logs/**,**/deploy/**,**.git/**,**.github/**,**.mypy_cache/**,**.pytest_cache/**,**.ruff_cache/**,**/test_results.txt/**,**/out/**,**/test_output*.txt/**,**/run_*.ps1/**,**/venv/** 

# === Additional Recommended Settings ===
# Activate ability to analyze Python 3.12 specific features.
# Usar ruta singular `reportPath` (documentado por SonarSource para Python).
# La ruta `reports/tests_junit.xml` coincide con la transferencia de artifact
# que se hará en el job sonarqube_analysis (artifact junit-report descargado a reports/).
sonar.python.xunit.reportPath=reports/tests_junit.xml

# Markdown report path (optional)
#sonar.report=markdown